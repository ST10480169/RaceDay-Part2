name: RaceDay Part 2 CI

on:
  push:
    branches: [ "main", "master", "part2", "Part3-Raceday" ]
  pull_request:
    branches: [ "main", "master", "part2", "Part3-Raceday" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj
      - name: Build
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
